{% extends 'base.html' %}{% block title %}Bookings{% endblock %}{% block content %}<div class="toolbar"><div><h2>Booking history</h2><p>Reservations, availability and charges.</p></div><button class="btn btn-dark rounded-pill px-4" onclick="openBooking()">＋ New booking</button></div><div class="panel"><div class="table-tools"><input class="form-control search" id="search" placeholder="Search vehicle registration…" oninput="loadBookings()"><button class="btn btn-outline-secondary rounded-pill" onclick="checkAvailability()">Check availability</button></div><div class="table-responsive"><table class="table"><thead><tr><th>VEHICLE</th><th>SLOT</th><th>START</th><th>END</th><th>DURATION</th><th>CHARGE</th><th>STATUS</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="modal fade" id="bookingModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" onsubmit="saveBooking(event)"><div class="modal-header"><h5 class="modal-title" id="bookingTitle">New booking</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="bookingId" type="hidden"><label>Vehicle</label><select id="bookingVehicle" class="form-select" required onchange="bookingVehicleChanged()"></select><label>Slot</label><select id="bookingSlot" class="form-select" required></select><label>Start date and time</label><input id="start_time" type="datetime-local" class="form-control" required><label>End date and time</label><input id="end_time" type="datetime-local" class="form-control" required><div class="calc-note" id="estimate">Choose dates to calculate the charge.</div></div><div class="modal-footer"><button class="btn btn-dark rounded-pill">Save booking</button></div></form></div></div><div class="modal fade" id="availabilityModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" onsubmit="findAvailability(event)"><div class="modal-header"><h5 class="modal-title">Check availability</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label>Vehicle type</label><select id="availType" class="form-select"><option>Car</option><option>Bike</option></select><label>Start</label><input id="availStart" type="datetime-local" class="form-control" required><label>End</label><input id="availEnd" type="datetime-local" class="form-control" required><div id="availabilityResults"></div></div><div class="modal-footer"><button class="btn btn-dark rounded-pill">Find slots</button></div></form></div></div>{% endblock %}{% block scripts %}<script>loadBookings()</script>{% endblock %}
