{% extends 'base.html' %}{% block title %}Parking slots{% endblock %}{% block content %}<div class="toolbar"><div><h2>Slot inventory</h2><p>Manage capacity, rates and maintenance.</p></div><button class="btn btn-dark rounded-pill px-4" onclick="openSlot()">＋ Add slot</button></div><div class="panel"><div class="table-tools"><select id="filterType" class="form-select filter" onchange="loadSlots()"><option value="">All types</option><option>Car</option><option>Bike</option></select><select id="filterStatus" class="form-select filter" onchange="loadSlots()"><option value="">All statuses</option><option>Available</option><option>Occupied</option><option>Maintenance</option></select></div><div class="table-responsive"><table class="table"><thead><tr><th>SLOT</th><th>TYPE</th><th>FLOOR</th><th>HOURLY RATE</th><th>STATUS</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="modal fade" id="slotModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" onsubmit="saveSlot(event)"><div class="modal-header"><h5 class="modal-title">Parking slot</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="slotId" type="hidden"><label>Slot number</label><input id="slot_number" class="form-control" required><label>Type</label><select id="slot_type" class="form-select"><option>Car</option><option>Bike</option></select><label>Floor</label><input id="floor" type="number" min="0" class="form-control" value="0" required><label>Hourly rate (₹)</label><input id="hourly_rate" type="number" min="0" step="0.01" class="form-control" required><label>Status</label><select id="status" class="form-select"><option>Available</option><option>Maintenance</option><option>Occupied</option></select></div><div class="modal-footer"><button class="btn btn-dark rounded-pill">Save slot</button></div></form></div></div>{% endblock %}{% block scripts %}<script>loadSlots()</script>{% endblock %}
