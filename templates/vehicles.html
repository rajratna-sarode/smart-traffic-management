{% extends 'base.html' %}{% block title %}Vehicles{% endblock %}{% block content %}<div class="toolbar"><div><h2>Vehicle directory</h2><p>Register and manage customer vehicles.</p></div><button class="btn btn-dark rounded-pill px-4" onclick="openVehicle()">＋ Add vehicle</button></div><div class="panel"><div class="table-tools"><input class="form-control search" id="search" placeholder="Search registration number…" oninput="loadVehicles()"><span id="count" class="muted"></span></div><div class="table-responsive"><table class="table"><thead><tr><th>OWNER</th><th>REGISTRATION</th><th>TYPE</th><th>MOBILE</th><th>REGISTERED</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="modal fade" id="vehicleModal"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" onsubmit="saveVehicle(event)"><div class="modal-header"><h5 class="modal-title">Vehicle details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="vehicleId" type="hidden"><label>Owner name</label><input id="owner_name" class="form-control" required><label>Registration number</label><input id="registration_number" class="form-control" required><label>Vehicle type</label><select id="vehicle_type" class="form-select"><option>Car</option><option>Bike</option></select><label>Mobile</label><input id="mobile" class="form-control" required></div><div class="modal-footer"><button class="btn btn-dark rounded-pill">Save vehicle</button></div></form></div></div>{% endblock %}{% block scripts %}<script>loadVehicles()</script>{% endblock %}
